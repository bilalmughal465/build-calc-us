name: Deploy BuildCalc site (clean)

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: buildcalc-us-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check ZIP present
        id: zipcheck
        run: |
          if [ -f buildcalc-site.zip ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "ZIP not present yet; skipping this run."
          fi

      - name: Guards, unpack and replace site
        if: steps.zipcheck.outputs.present == 'true'
        run: |
          set -e
          ZIP=buildcalc-site.zip
          rm -rf /tmp/site
          mkdir -p /tmp/site
          unzip -o "$ZIP" -d /tmp/site
          test -f /tmp/site/index.html
          grep -q "BuildCalc" /tmp/site/index.html
          test -f /tmp/site/robots.txt
          test -f /tmp/site/sitemap.xml
          test -f /tmp/site/assets/style.css
          test -f /tmp/site/assets/glass-override.css
          COUNT=$(find /tmp/site -name '*.html' | wc -l)
          echo "HTML pages: $COUNT"
          if [ "$COUNT" -lt 4000 ]; then
            echo "Guard failed: too few HTML pages"
            exit 1
          fi
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name "$ZIP" -exec rm -rf {} +
          cp -a /tmp/site/. .
          rm -rf .github "$ZIP"
          git add -A
          git -c user.name=bilalmughal465 -c user.email=bilalmughal465@users.noreply.github.com commit -m "Deploy BuildCalc glass site (1180px, v3)"
          git push
